options {
    directory "/var/cache/bind";
    listen-on port 53 { any; };
    listen-on-v6 { none; };
    allow-query { any; };
    recursion no;
    dnssec-validation no;
    pid-file "/var/cache/bind/named.pid";
};
zone "cloud.local" IN {
    type primary;
    file "/var/cache/bind/db.cloud.local";
};
// Keep the legacy TV3 zone as an additional authoritative zone.
zone "myminicloud.local" IN {
    type primary;
    file "/var/cache/bind/db.myminicloud.local";
};
