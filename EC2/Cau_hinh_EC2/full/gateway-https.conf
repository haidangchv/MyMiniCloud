
upstream minicloud_grafana { zone minicloud_grafana 64k; server monitoring-grafana-dashboard-server:3000 resolve; }
upstream minicloud_prometheus { zone minicloud_prometheus 64k; server monitoring-prometheus-server:9090 resolve; }
upstream minicloud_console { zone minicloud_console 64k; server object-storage-server:9001 resolve; }
upstream minicloud_storage { zone minicloud_storage 64k; server object-storage-server:9000 resolve; }

resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 3s;

upstream minicloud_web {
    zone minicloud_web 64k;
    server web-frontend-server:80 resolve;
    server web-frontend-server-2:80 resolve;
}

upstream minicloud_app {
    zone minicloud_app 64k;
    server application-backend-server:5000 resolve;
}

upstream minicloud_auth {
    zone minicloud_auth 64k;
    server authentication-identity-server:8080 resolve;
}

server {
    listen 80;
    server_name _;
    absolute_redirect off;

    add_header X-MyMiniCloud-Gateway nginx always;
    add_header X-Upstream-Addr $upstream_addr always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header Forwarded "";

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /_gateway/health {
        default_type text/plain;
        return 200 "gateway ok\n";
    }

    location = /gateway-health {
        default_type text/plain;
        return 200 "gateway ok\n";
    }

    location /api/ {
        error_page 502 504 = @backend_unavailable;
        proxy_pass http://minicloud_app/;
    }

    location = /student/ {
        error_page 502 504 = @backend_unavailable;
        proxy_pass http://minicloud_app/student;
    }

    location = /student {
        error_page 502 504 = @backend_unavailable;
        proxy_pass http://minicloud_app/student;
    }

    location = /students-db {
        error_page 502 504 = @backend_unavailable;
        proxy_pass http://minicloud_app/students-db;
    }

    location @backend_unavailable {
        default_type application/json;
        return 503 '{"error":"backend_unavailable"}';
    }

    location = /auth {
        return 308 /auth/;
    }

    # Relative redirect keeps the browser on the same Gateway origin.
    location = /auth/ {
        return 302 /auth/realms/myminicloud/account/;
    }

    # Administration is available only on the loopback-published Keycloak port.
    location = /auth/admin { return 403; }
    location /auth/admin/ { return 403; }

    location /auth/ {
        proxy_pass http://minicloud_auth;
    }

    location / {
        proxy_pass http://minicloud_web;
    }
}

server {
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/54.227.182.163/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/54.227.182.163/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 20m;
    server_name _;
    absolute_redirect off;

    add_header X-MyMiniCloud-Gateway nginx always;
    add_header X-Upstream-Addr $upstream_addr always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header Forwarded "";

    location = /_gateway/health {
        default_type text/plain;
        return 200 "gateway ok\n";
    }

    location = /gateway-health {
        default_type text/plain;
        return 200 "gateway ok\n";
    }

    location /api/ {
        error_page 502 504 = @backend_unavailable;
        proxy_pass http://minicloud_app/;
    }

    location = /student/ {
        error_page 502 504 = @backend_unavailable;
        proxy_pass http://minicloud_app/student;
    }

    location = /student {
        error_page 502 504 = @backend_unavailable;
        proxy_pass http://minicloud_app/student;
    }

    location = /students-db {
        error_page 502 504 = @backend_unavailable;
        proxy_pass http://minicloud_app/students-db;
    }

    location @backend_unavailable {
        default_type application/json;
        return 503 '{"error":"backend_unavailable"}';
    }

    location = /auth {
        return 308 /auth/;
    }

    # Relative redirect keeps the browser on the same Gateway origin.
    location = /auth/ {
        return 302 /auth/realms/realm_sv001/account/;
    }

    # Administration is available only on the loopback-published Keycloak port.
    location = /auth/admin { allow 27.78.105.91; allow 156.59.62.183; deny all; return 308 /auth/admin/; }
    location /auth/admin/ { allow 27.78.105.91; allow 156.59.62.183; deny all; proxy_pass http://minicloud_auth; }
    location /auth/realms/master/ { allow 27.78.105.91; allow 156.59.62.183; deny all; proxy_pass http://minicloud_auth; }

    location /auth/ {
        proxy_pass http://minicloud_auth;
    }


    location = /grafana { return 308 /grafana/; }
    location /grafana/api/live/ {
        allow 27.78.105.91; allow 156.59.62.183; deny all;
        proxy_pass http://minicloud_grafana;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location /grafana/ { allow 27.78.105.91; allow 156.59.62.183; deny all; proxy_pass http://minicloud_grafana; }
    location = /prometheus { return 308 /prometheus/; }
    location /prometheus/ { allow 27.78.105.91; allow 156.59.62.183; deny all; proxy_pass http://minicloud_prometheus/; }
    location = /minio/ui { return 308 /minio/ui/; }
    location /minio/ui/ {
        allow 27.78.105.91; allow 156.59.62.183; deny all;
        proxy_pass http://minicloud_console/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }
    location = /profile-pics/avatar.jpg { proxy_pass http://minicloud_storage; }
    location = /demo/index.html { proxy_pass http://minicloud_storage; }

    location / {
        proxy_pass http://minicloud_web;
    }
}
