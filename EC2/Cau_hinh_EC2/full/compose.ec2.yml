services:
  application-backend-server:
    environment:
      OIDC_ISSUER: ${PUBLIC_BASE_URL}/auth/realms/realm_sv001
      OIDC_AUDIENCE: flask-app
      OIDC_JWKS_URL: http://authentication-identity-server:8080/auth/realms/realm_sv001/protocol/openid-connect/certs
  authentication-identity-server:
    volumes:
      - ./.local/full/realm-sv001-private.json:/opt/keycloak/data/import/realm-sv001.json:ro
  monitoring-node-exporter-server:
    ports: !override
      - "127.0.0.1:9100:9100"
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
  monitoring-cadvisor-server:
    image: ghcr.io/google/cadvisor:0.56.2
    ports: !override
      - "127.0.0.1:8083:8080"
  monitoring-prometheus-server:
    ports: !override
      - "127.0.0.1:9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
      - --storage.tsdb.retention.size=1GB
  monitoring-grafana-dashboard-server:
    ports: !override
      - "127.0.0.1:3000:3000"
