name: myminicloud

services:
  # =========================================================================
  # THÀNH VIÊN 1 (TV1): API Gateway, Load Balancer & Web Server Cluster
  # =========================================================================
  api-gateway-proxy-server:
    build:
      context: ./api-gateway-proxy-server
    image: myminicloud-gateway:dev
    container_name: api-gateway-proxy-server
    hostname: api-gateway-proxy-server
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:80"
    depends_on:
      web-frontend-server:
        condition: service_healthy
      web-frontend-server-2:
        condition: service_healthy
    networks:
      - cloud-net
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/gateway-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  web-frontend-server:
    build:
      context: ./web-frontend-server
    image: myminicloud-web:dev
    container_name: web-frontend-server
    hostname: web-frontend-server-1
    restart: unless-stopped
    ports:
      - "8081:80"
    networks:
      - cloud-net
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  web-frontend-server-2:
    build:
      context: ./web-frontend-server
    image: myminicloud-web:dev
    container_name: web-frontend-server-2
    hostname: web-frontend-server-2
    restart: unless-stopped
    ports:
      - "8082:80"
    networks:
      - cloud-net
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # =========================================================================
  # THÀNH VIÊN 2 (TV2): Flask Application Backend & MariaDB
  # =========================================================================
  application-backend-server:
    build:
      context: ./application-backend-server
    image: myminicloud-app:dev
    container_name: application-backend-server
    hostname: application-backend-server
    restart: unless-stopped
    ports:
      - "5000:5000"
      - "8085:5000"
    environment:
      PORT: 5000
      OIDC_ISSUER: "http://authentication-identity-server:8080/realms/master"
      OIDC_AUDIENCE: "myapp"
      DB_HOST: "relational-database-server"
      DB_USER: "root"
      DB_PASS: "root"
      DB_NAME: "studentdb"
      DB_PORT: 3306
    depends_on:
      relational-database-server:
        condition: service_healthy
    networks:
      - cloud-net
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5000/hello || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  relational-database-server:
    image: mariadb:11
    container_name: relational-database-server
    hostname: relational-database-server
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: minicloud
    volumes:
      - ./relational-database-server/init:/docker-entrypoint-initdb.d:ro
      - mariadb_data:/var/lib/mysql
    networks:
      - cloud-net
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # =========================================================================
  # THÀNH VIÊN 3 (TV3): Keycloak, MinIO & Bind9 Internal DNS
  # =========================================================================
  # authentication-identity-server:
  #   container_name: authentication-identity-server
  #   networks:
  #     - cloud-net
  #
  # object-storage-server:
  #   container_name: object-storage-server
  #   networks:
  #     - cloud-net
  #
  # internal-dns-server:
  #   container_name: internal-dns-server
  #   networks:
  #     - cloud-net

  # =========================================================================
  # THÀNH VIÊN 4 (TV4): Prometheus, Grafana & Exporters
  # =========================================================================
  # monitoring-prometheus-server:
  #   container_name: monitoring-prometheus-server
  #   networks:
  #     - cloud-net
  #
  # monitoring-grafana-dashboard-server:
  #   container_name: monitoring-grafana-dashboard-server
  #   networks:
  #     - cloud-net

networks:
  cloud-net:
    name: cloud-net
    driver: bridge

volumes:
  mariadb_data:
