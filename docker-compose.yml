name: myminicloud

services:
  # =========================================================================
  # THÀNH VIÊN 1 (TV1): API Gateway, Load Balancer & Web Server Cluster
  # =========================================================================
  api-gateway-proxy-server:
    build:
      context: ./api-gateway-proxy-server
    image: myminicloud-gateway:dev
    container_name: api-gateway-proxy-server
    hostname: api-gateway-proxy-server
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:80"
    depends_on:
      web-frontend-server:
        condition: service_healthy
      web-frontend-server-2:
        condition: service_healthy
    networks:
      - cloud-net
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/gateway-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  web-frontend-server:
    build:
      context: ./web-frontend-server
    image: myminicloud-web:dev
    container_name: web-frontend-server
    hostname: web-frontend-server-1
    restart: unless-stopped
    ports:
      - "8081:80"
    networks:
      - cloud-net
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  web-frontend-server-2:
    build:
      context: ./web-frontend-server
    image: myminicloud-web:dev
    container_name: web-frontend-server-2
    hostname: web-frontend-server-2
    restart: unless-stopped
    ports:
      - "8082:80"
    networks:
      - cloud-net
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # =========================================================================
  # THÀNH VIÊN 2 (TV2): Flask Application Backend & MariaDB
  # =========================================================================
  application-backend-server:
    build:
      context: ./application-backend-server
    image: myminicloud-app:dev
    container_name: application-backend-server
    hostname: application-backend-server
    restart: unless-stopped
    ports:
      - "5000:5000"
      - "8085:5000"
    environment:
      PORT: 5000
      OIDC_ISSUER: "http://authentication-identity-server:8080/realms/master"
      OIDC_AUDIENCE: "myapp"
      DB_HOST: "relational-database-server"
      DB_USER: "root"
      DB_PASS: "root"
      DB_NAME: "studentdb"
      DB_PORT: 3306
    depends_on:
      relational-database-server:
        condition: service_healthy
    networks:
      - cloud-net
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5000/hello || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  relational-database-server:
    image: mariadb:11
    container_name: relational-database-server
    hostname: relational-database-server
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: minicloud
    volumes:
      - ./relational-database-server/init:/docker-entrypoint-initdb.d:ro
      - mariadb_data:/var/lib/mysql
    networks:
      - cloud-net
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # =========================================================================
  # THÀNH VIÊN 3 (TV3): Keycloak, MinIO & Bind9 Internal DNS
  # =========================================================================
  # authentication-identity-server:
  #   container_name: authentication-identity-server
  #   networks:
  #     - cloud-net
  #
  # object-storage-server:
  #   container_name: object-storage-server
  #   networks:
  #     - cloud-net
  #
  # internal-dns-server:
  #   container_name: internal-dns-server
  #   networks:
  #     - cloud-net

  # =========================================================================
  # THÀNH VIÊN 4 (TV4): Node Exporter, cAdvisor, Prometheus & Grafana
  # =========================================================================
  monitoring-node-exporter-server:
    image: prom/node-exporter:v1.8.2
    container_name: monitoring-node-exporter-server
    hostname: monitoring-node-exporter-server
    restart: unless-stopped
    ports:
      - "9100:9100"
    networks:
      - cloud-net
    mem_limit: 64m
    cpus: 0.25

  monitoring-cadvisor-server:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: monitoring-cadvisor-server
    hostname: monitoring-cadvisor-server
    restart: unless-stopped
    privileged: true
    command:
      - "--docker_only=true"
      - "--housekeeping_interval=10s"
    ports:
      - "8083:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - cloud-net
    mem_limit: 320m
    cpus: 0.5

  monitoring-prometheus-server:
    image: prom/prometheus:v2.54.1
    container_name: monitoring-prometheus-server
    hostname: monitoring-prometheus-server
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring-prometheus-server/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - cloud-net
    depends_on:
      - monitoring-node-exporter-server
      - monitoring-cadvisor-server
    mem_limit: 256m
    cpus: 0.5

  monitoring-grafana-dashboard-server:
    image: grafana/grafana:11.2.0
    container_name: monitoring-grafana-dashboard-server
    hostname: monitoring-grafana-dashboard-server
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring-grafana-dashboard-server/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring-grafana-dashboard-server/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - cloud-net
    depends_on:
      - monitoring-prometheus-server
    mem_limit: 384m
    cpus: 0.5

networks:
  cloud-net:
    name: cloud-net
    driver: bridge

volumes:
  mariadb_data:
  prometheus_data:
  grafana_data:
