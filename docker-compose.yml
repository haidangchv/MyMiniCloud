name: myminicloud

services:
  # =========================================================================
  # THÀNH VIÊN 1 (TV1): API Gateway, Load Balancer & Web Server Cluster
  # =========================================================================
  api-gateway-proxy-server:
    build:
      context: ./api-gateway-proxy-server
    image: myminicloud-gateway:dev
    container_name: api-gateway-proxy-server
    hostname: api-gateway-proxy-server
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:80"
    depends_on:
      web-frontend-server:
        condition: service_healthy
      web-frontend-server-2:
        condition: service_healthy
    networks:
      - cloud-net
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/gateway-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  web-frontend-server:
    build:
      context: ./web-frontend-server
    image: myminicloud-web:dev
    container_name: web-frontend-server
    hostname: web-frontend-server-1
    restart: unless-stopped
    ports:
      - "8081:80"
    networks:
      - cloud-net
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  web-frontend-server-2:
    build:
      context: ./web-frontend-server
    image: myminicloud-web:dev
    container_name: web-frontend-server-2
    hostname: web-frontend-server-2
    restart: unless-stopped
    ports:
      - "8082:80"
    networks:
      - cloud-net
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # =========================================================================
  # THÀNH VIÊN 2 (TV2): Flask Application Backend & MariaDB
  # (Bỏ comment khi TV2 tích hợp code vào thư mục tương ứng)
