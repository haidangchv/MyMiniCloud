name: myminicloud

x-web: &web
  build:
    context: ./web-frontend-server
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 10s

services:
  web-frontend-server:
    <<: *web
    image: myminicloud-web:dev
    container_name: web-frontend-server
    hostname: web-frontend-server1
    ports:
      - "127.0.0.1:8080:80"
    networks:
      cloud-net:
        ipv4_address: 10.10.10.10
        aliases:
          - web
          - web-frontend-server1

  web-frontend-server2:
    <<: *web
    image: myminicloud-web:dev-replica
    container_name: web-frontend-server-2
    hostname: web-frontend-server2
    ports:
      - "127.0.0.1:8082:80"
    networks:
      cloud-net:
        ipv4_address: 10.10.10.11
        aliases:
          - web2
          - web-frontend-server2
          - web-frontend-server-2

  api-gateway-proxy-server:
    build:
      context: ./api-gateway-proxy-server
    image: myminicloud-gateway:dev
    container_name: api-gateway-proxy-server
    restart: unless-stopped
    depends_on:
      web-frontend-server:
        condition: service_healthy
      web-frontend-server2:
        condition: service_healthy
    ports:
      - "${GATEWAY_HTTP_BIND:-127.0.0.1}:80:80"
    networks:
      cloud-net:
        ipv4_address: 10.10.10.60
        aliases:
          - proxy
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/_gateway/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  application-backend-server:
    build:
      context: ./application-backend-server
    image: myminicloud-app:dev
    container_name: application-backend-server
    hostname: application-backend-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:5000"
      - "127.0.0.1:5000:5000"
    environment:
      PORT: 5000
      OIDC_ISSUER: "${PUBLIC_BASE_URL:-http://127.0.0.1}/auth/realms/myminicloud"
      OIDC_AUDIENCE: myminicloud-app
      OIDC_JWKS_URL: http://authentication-identity-server:8080/auth/realms/myminicloud/protocol/openid-connect/certs
      DB_HOST: relational-database-server
      DB_USER: root
      DB_PASS: "${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env}"
      DB_NAME: studentdb
      DB_PORT: 3306
    depends_on:
      relational-database-server:
        condition: service_healthy
    networks:
      cloud-net:
        ipv4_address: 10.10.10.20
        aliases:
          - app-server
          - app-backend
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/hello', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  relational-database-server:
    image: mariadb:11
    container_name: relational-database-server
    hostname: relational-database-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env}"
      MARIADB_DATABASE: minicloud
    volumes:
      - ./relational-database-server/init:/docker-entrypoint-initdb.d:ro
      - mariadb_data:/var/lib/mysql
    networks:
      cloud-net:
        ipv4_address: 10.10.10.50
        aliases:
          - db
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

  authentication-identity-server:
    image: quay.io/keycloak/keycloak:26.4.7
    container_name: authentication-identity-server
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_ADMIN_USER:-admin}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: "${PUBLIC_BASE_URL:-http://127.0.0.1}/auth"
      KC_HOSTNAME_ADMIN: "${KEYCLOAK_ADMIN_URL:-http://127.0.0.1:8081/auth}"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_MANAGEMENT_RELATIVE_PATH: /
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./authentication-identity-server/realm-export.json:/opt/keycloak/data/import/myminicloud-realm.json:ro
      - keycloak_data:/opt/keycloak/data
    networks:
      cloud-net:
        ipv4_address: 10.10.10.40
        aliases:
          - keycloak
    mem_limit: 1g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3; grep -q '200 OK' <&3"]
      interval: 15s
      timeout: 5s
      retries: 24
      start_period: 360s

  object-storage-server:
    build:
      context: ./object-storage-server
    image: myminicloud-minio:RELEASE.2025-10-15T17-29-55Z
    container_name: object-storage-server
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minicloud_admin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    networks:
      cloud-net:
        ipv4_address: 10.10.10.30
        aliases:
          - minio
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  internal-dns-server:
    build:
      context: ./internal-dns-server
    image: myminicloud-bind9:9.20
    container_name: internal-dns-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DNS_HOST_PORT:-1053}:53/udp"
      - "127.0.0.1:${DNS_HOST_PORT:-1053}:53/tcp"
    networks:
      cloud-net:
        ipv4_address: 10.10.10.53
        aliases:
          - dns-server
          - ns
    depends_on:
      api-gateway-proxy-server:
        condition: service_healthy
      application-backend-server:
        condition: service_healthy
      relational-database-server:
        condition: service_healthy
      authentication-identity-server:
        condition: service_healthy
      object-storage-server:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "dig @127.0.0.1 cloud.local SOA +short | grep -q ns1.cloud.local"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  monitoring-node-exporter-server:
    image: prom/node-exporter:v1.8.2
    container_name: monitoring-node-exporter-server
    hostname: monitoring-node-exporter-server
    restart: unless-stopped
    ports:
      - "9100:9100"
    networks:
      - cloud-net
    mem_limit: 64m
    cpus: 0.25

  monitoring-cadvisor-server:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: monitoring-cadvisor-server
    hostname: monitoring-cadvisor-server
    restart: unless-stopped
    privileged: true
    command:
      - "--docker_only=true"
      - "--housekeeping_interval=10s"
    ports:
      - "8083:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - cloud-net
    mem_limit: 320m
    cpus: 0.5

  monitoring-prometheus-server:
    image: prom/prometheus:v2.54.1
    container_name: monitoring-prometheus-server
    hostname: monitoring-prometheus-server
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring-prometheus-server/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - cloud-net
    depends_on:
      - monitoring-node-exporter-server
      - monitoring-cadvisor-server
    mem_limit: 256m
    cpus: 0.5

  monitoring-grafana-dashboard-server:
    image: grafana/grafana:11.2.0
    container_name: monitoring-grafana-dashboard-server
    hostname: monitoring-grafana-dashboard-server
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring-grafana-dashboard-server/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring-grafana-dashboard-server/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - cloud-net
    depends_on:
      - monitoring-prometheus-server
    mem_limit: 384m
    cpus: 0.5
networks:
  cloud-net:
    name: cloud-net
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.10.0/24
          ip_range: 10.10.10.128/25

volumes:
  mariadb_data:
  keycloak_data:
  minio_data:
  prometheus_data:
  grafana_data:
