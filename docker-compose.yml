name: myminicloud

services:
  # =========================================================================
  # THÀNH VIÊN 1 (TV1 - Nguyễn Xuân Bằng): API Gateway, Load Balancer & Web
  # =========================================================================
  api-gateway-proxy-server:
    build:
      context: ./api-gateway-proxy-server
    image: myminicloud-gateway:dev
    container_name: api-gateway-proxy-server
    hostname: api-gateway-proxy-server
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      web-frontend-server:
        condition: service_healthy
      web-frontend-server-2:
        condition: service_healthy
    networks:
      cloud-net:
        ipv4_address: 10.10.10.60
        aliases:
          - proxy
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/gateway-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  web-frontend-server:
    build:
      context: ./web-frontend-server
    image: myminicloud-web:dev
    container_name: web-frontend-server
    hostname: web-frontend-server-1
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      cloud-net:
        ipv4_address: 10.10.10.10
        aliases:
          - web
          - web-frontend-server1
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  web-frontend-server-2:
    build:
      context: ./web-frontend-server
    image: myminicloud-web:dev
    container_name: web-frontend-server-2
    hostname: web-frontend-server-2
    restart: unless-stopped
    ports:
      - "8082:80"
    networks:
      cloud-net:
        ipv4_address: 10.10.10.11
        aliases:
          - web2
          - web-frontend-server2
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # =========================================================================
  # THÀNH VIÊN 2 (TV2 - Bùi Huy Báu): Flask Application Backend & MariaDB
  # =========================================================================
  application-backend-server:
    build:
      context: ./application-backend-server
    image: myminicloud-app:dev
    container_name: application-backend-server
    hostname: application-backend-server
    restart: unless-stopped
    ports:
      - "5000:5000"
      - "8085:5000"
    environment:
      PORT: 5000
      OIDC_REALM: "realm_sv001"
      OIDC_ISSUER: "http://localhost:8081/realms/realm_sv001"
      OIDC_AUDIENCE: "flask-app"
      KEYCLOAK_INTERNAL_URL: "http://authentication-identity-server:8080"
      OIDC_JWKS_URL: "http://authentication-identity-server:8080/realms/realm_sv001/protocol/openid-connect/certs"
      DB_HOST: "relational-database-server"
      DB_USER: "root"
      DB_PASS: "root"
      DB_NAME: "studentdb"
      DB_PORT: 3306
    depends_on:
      relational-database-server:
        condition: service_healthy
    networks:
      cloud-net:
        ipv4_address: 10.10.10.20
        aliases:
          - app-server
          - app-backend
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/hello')\" || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  relational-database-server:
    image: mariadb:11
    container_name: relational-database-server
    hostname: relational-database-server
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: minicloud
    volumes:
      - ./relational-database-server/init:/docker-entrypoint-initdb.d:ro
      - mariadb_data:/var/lib/mysql
    networks:
      cloud-net:
        ipv4_address: 10.10.10.50
        aliases:
          - db
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # =========================================================================
  # THÀNH VIÊN 3 (TV3 - Nguyễn Hải Đăng): Keycloak, MinIO & Bind9 Internal DNS
  # =========================================================================
  authentication-identity-server:
    image: quay.io/keycloak/keycloak:latest
    container_name: authentication-identity-server
    hostname: authentication-identity-server
    command: ["start-dev", "--import-realm"]
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: "xforwarded"
    volumes:
      - ./authentication-identity-server/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    networks:
      cloud-net:
        ipv4_address: 10.10.10.40
        aliases:
          - keycloak
    mem_limit: 1g
    cpus: 1.0

  object-storage-server:
    image: minio/minio:latest
    container_name: object-storage-server
    hostname: object-storage-server
    command: ["server", "/data", "--console-address", ":9001"]
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./object-storage-server/data:/data
    networks:
      cloud-net:
        ipv4_address: 10.10.10.30
        aliases:
          - minio
    mem_limit: 256m
    cpus: 0.5

  internal-dns-server:
    image: internetsystemsconsortium/bind9:9.18
    container_name: internal-dns-server
    hostname: internal-dns-server
    restart: unless-stopped
    ports:
      - "1053:53/udp"
      - "1053:53/tcp"
    volumes:
      - ./internal-dns-server/named.conf.options:/etc/bind/named.conf.options:ro
      - ./internal-dns-server/named.conf.local:/etc/bind/named.conf.local:ro
      - ./internal-dns-server/db.cloud.local:/etc/bind/db.cloud.local:ro
    networks:
      cloud-net:
        ipv4_address: 10.10.10.53
        aliases:
          - dns-server
    mem_limit: 128m
    cpus: 0.5

  # =========================================================================
  # THÀNH VIÊN 4 (TV4): Prometheus (9090), Grafana (3000) & Node Exporter (9100)
  # (Để lại cho TV4 tự cấu hình và mở comment)
  # =========================================================================
